apiVersion: v1
kind: ConfigMap
metadata:
  name: n8n-config
  namespace: n8n
data:
  N8N_HOST: "n8n.local"
  N8N_PORT: "5678"
  N8N_PROTOCOL: "https"
  WEBHOOK_URL: "https://n8n.local/"
  GENERIC_TIMEZONE: "Asia/Seoul"
  N8N_LOG_LEVEL: "info"
  N8N_METRICS: "true"
  N8N_METRICS_PREFIX: "n8n_"
  N8N_DIAGNOSTICS_ENABLED: "true"

  # Execution settings
  EXECUTIONS_MODE: "regular"
  # Redis configuration (disabled for now due to private endpoint connectivity)
  # QUEUE_BULL_REDIS_HOST: "redis-rg-liked-yak.privatelink.redis.cache.windows.net"
  # QUEUE_BULL_REDIS_PORT: "6380"
  # QUEUE_BULL_REDIS_TLS: "true"

  # Security
  N8N_BASIC_AUTH_ACTIVE: "true"
  N8N_SECURE_COOKIE: "false"
