# N8N Private Endpoint 구성
# 이 파일은 참조용이며, Azure Portal 또는 Terraform으로 생성해야 합니다.

# Private Endpoint는 Kubernetes 리소스가 아닌 Azure 리소스입니다.
# 아래는 Azure CLI로 생성하는 명령어입니다:

# 1. Private Link Service 확인 (Service 배포 후)
# az network private-link-service list --resource-group <node-resource-group> --query "[?name=='n8n-pls']"

# 2. Private Link Service ID 가져오기
# PLS_ID=$(az network private-link-service list \
#   --resource-group <node-resource-group> \
#   --query "[?name=='n8n-pls'].id" -o tsv)

# 3. Private Endpoint 생성
# az network private-endpoint create \
#   --name n8n-private-endpoint \
#   --resource-group rg-useful-cougar \
#   --vnet-name rg-useful-cougar-vnet \
#   --subnet private-endpoints-subnet \
#   --private-connection-resource-id $PLS_ID \
#   --connection-name n8n-connection \
#   --location koreacentral

# 4. Private DNS Zone 생성 (선택사항)
# az network private-dns zone create \
#   --resource-group rg-useful-cougar \
#   --name n8n.internal

# 5. Private DNS Zone을 VNet에 연결
# az network private-dns link vnet create \
#   --resource-group rg-useful-cougar \
#   --zone-name n8n.internal \
#   --name n8n-dns-link \
#   --virtual-network rg-useful-cougar-vnet \
#   --registration-enabled false

# 6. Private DNS A 레코드 생성
# PE_IP=$(az network private-endpoint show \
#   --name n8n-private-endpoint \
#   --resource-group rg-useful-cougar \
#   --query 'customDnsConfigs[0].ipAddresses[0]' -o tsv)
#
# az network private-dns record-set a create \
#   --name n8n \
#   --zone-name n8n.internal \
#   --resource-group rg-useful-cougar
#
# az network private-dns record-set a add-record \
#   --record-set-name n8n \
#   --zone-name n8n.internal \
#   --resource-group rg-useful-cougar \
#   --ipv4-address $PE_IP

# 접속: http://n8n.n8n.internal (VNet 내부에서만 접근 가능)
