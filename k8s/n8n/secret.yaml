apiVersion: v1
kind: Secret
metadata:
  name: n8n-secrets
  namespace: n8n
type: Opaque
stringData:
  # N8N Basic Auth (기존 인증키 사용)
  N8N_BASIC_AUTH_USER: "admin"
  N8N_BASIC_AUTH_PASSWORD: "HEeG57YwIUD8qE9r"  # 기존 AKS에서 사용하던 인증키

  # N8N Encryption Key (기존 키 사용)
  N8N_ENCRYPTION_KEY: "HEeG57YwIUD8qE9r"

  # Database connection (PostgreSQL)
  DB_TYPE: "postgresdb"
  DB_POSTGRESDB_HOST: "postgres.n8n.svc.cluster.local"
  DB_POSTGRESDB_PORT: "5432"
  DB_POSTGRESDB_DATABASE: "n8n"
  DB_POSTGRESDB_USER: "n8nuser"
  DB_POSTGRESDB_PASSWORD: "PostgresN8n2025!"
