apiVersion: v1
kind: Secret
metadata:
  name: n8n-secrets
  namespace: n8n
type: Opaque
stringData:
  # N8N Basic Auth (기존 인증키 사용)
  N8N_BASIC_AUTH_USER: "admin"
  N8N_BASIC_AUTH_PASSWORD: "HEeG57YwIUD8qE9r"  # 기존 AKS에서 사용하던 인증키

  # N8N Encryption Key (기존 키 사용)
  N8N_ENCRYPTION_KEY: "HEeG57YwIUD8qE9r"

  # Database connection (MySQL Master)
  DB_TYPE: "mysqldb"
  DB_MYSQLDB_HOST: "mysql-master-rg-useful-cougar.mysql.database.azure.com"
  DB_MYSQLDB_PORT: "3306"
  DB_MYSQLDB_DATABASE: "n8n"
  DB_MYSQLDB_USER: "mysqladmin"
  DB_MYSQLDB_PASSWORD: ""  # Managed Identity 사용
