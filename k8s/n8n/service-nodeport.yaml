apiVersion: v1
kind: Service
metadata:
  name: n8n-nodeport
  namespace: n8n
  labels:
    app: n8n
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "5678"
    prometheus.io/path: "/metrics"
spec:
  type: NodePort
  ports:
  - port: 80
    targetPort: 5678
    nodePort: 30678  # 30000-32767 범위
    protocol: TCP
    name: http
  - port: 443
    targetPort: 5678
    nodePort: 30679
    protocol: TCP
    name: https
  selector:
    app: n8n
