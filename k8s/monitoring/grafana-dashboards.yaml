apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-n8n
  namespace: monitoring
data:
  n8n-dashboard.json: |
    {
      "dashboard": {
        "title": "N8N Monitoring Dashboard",
        "tags": ["n8n", "workflow", "automation"],
        "timezone": "browser",
        "panels": [
          {
            "title": "N8N Workflow Executions",
            "targets": [
              {
                "expr": "rate(n8n_executions_total[5m])",
                "legendFormat": "Executions/sec"
              }
            ],
            "type": "graph"
          },
          {
            "title": "N8N Active Workflows",
            "targets": [
              {
                "expr": "n8n_active_workflows",
                "legendFormat": "Active Workflows"
              }
            ],
            "type": "stat"
          },
          {
            "title": "N8N Execution Duration",
            "targets": [
              {
                "expr": "histogram_quantile(0.95, rate(n8n_workflow_execution_duration_seconds_bucket[5m]))",
                "legendFormat": "p95 Duration"
              }
            ],
            "type": "graph"
          },
          {
            "title": "N8N Error Rate",
            "targets": [
              {
                "expr": "rate(n8n_execution_errors_total[5m])",
                "legendFormat": "Errors/sec"
              }
            ],
            "type": "graph"
          },
          {
            "title": "N8N Pod CPU Usage",
            "targets": [
              {
                "expr": "rate(container_cpu_usage_seconds_total{namespace='n8n',pod=~'n8n-.*'}[5m])",
                "legendFormat": "{{pod}}"
              }
            ],
            "type": "graph"
          },
          {
            "title": "N8N Pod Memory Usage",
            "targets": [
              {
                "expr": "container_memory_usage_bytes{namespace='n8n',pod=~'n8n-.*'}",
                "legendFormat": "{{pod}}"
              }
            ],
            "type": "graph"
          }
        ]
      }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-kubernetes
  namespace: monitoring
data:
  kubernetes-dashboard.json: |
    {
      "dashboard": {
        "title": "Kubernetes Cluster Overview",
        "tags": ["kubernetes", "cluster", "infrastructure"],
        "timezone": "browser",
        "panels": [
          {
            "title": "Cluster CPU Usage",
            "targets": [
              {
                "expr": "sum(rate(container_cpu_usage_seconds_total[5m])) by (namespace)",
                "legendFormat": "{{namespace}}"
              }
            ],
            "type": "graph"
          },
          {
            "title": "Cluster Memory Usage",
            "targets": [
              {
                "expr": "sum(container_memory_usage_bytes) by (namespace)",
                "legendFormat": "{{namespace}}"
              }
            ],
            "type": "graph"
          },
          {
            "title": "Pod Status",
            "targets": [
              {
                "expr": "kube_pod_status_phase",
                "legendFormat": "{{phase}}"
              }
            ],
            "type": "piechart"
          },
          {
            "title": "Node Status",
            "targets": [
              {
                "expr": "kube_node_status_condition{condition='Ready'}",
                "legendFormat": "{{node}}"
              }
            ],
            "type": "stat"
          },
          {
            "title": "Persistent Volume Usage",
            "targets": [
              {
                "expr": "kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes * 100",
                "legendFormat": "{{persistentvolumeclaim}}"
              }
            ],
            "type": "graph"
          },
          {
            "title": "Network I/O",
            "targets": [
              {
                "expr": "rate(container_network_receive_bytes_total[5m])",
                "legendFormat": "RX: {{pod}}"
              },
              {
                "expr": "rate(container_network_transmit_bytes_total[5m])",
                "legendFormat": "TX: {{pod}}"
              }
            ],
            "type": "graph"
          }
        ]
      }
    }
